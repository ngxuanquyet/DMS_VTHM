<!DOCTYPE html>

<html lang="en"><head>

                      "primary-container": "#47b347",

                      "on-error-container": "#93000a",

              "borderRadius": {

              "spacing": {

<style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Custom focus styles for input fields to match brand */
        .input-field:focus-within .input-icon {
            color: #006e15; /* primary token */
        }
    </style>
</head>
<body class="bg-surface min-h-screen flex flex-col justify-center items-center px-margin-mobile relative overflow-hidden">
<!-- Subtle background pattern/texture for 'structured prestige' -->
<div class="absolute inset-0 pointer-events-none opacity-20" style="background-image: radial-gradient(circle at 1px 1px, #becab7 1px, transparent 0); background-size: 24px 24px;"></div>
<main class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant p-stack-lg relative z-10 animate-fade-in-up">
<!-- Header / Logo Area -->
<header class="flex flex-col items-center text-center mb-stack-lg">
<div class="w-32 h-24 mb-stack-md flex items-center justify-center">
<img alt="VTHM Logo" class="object-contain w-full h-full" data-alt="A clean, corporate logo design featuring interlocking geometric shapes in vibrant emerald green and deep industrial blue. The style is modern, sharp, and structured, reflecting a large-scale manufacturing or enterprise group. The background is pure white to ensure the colors pop. Light mode aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBKqMSkEzI3XZ9FWpn807KiwURnOJ2REUu1xSD5MuchOntPuNLq_1hV7A_LHbJ2EuMjuBbgW3m79yH40-YoTzKTdPUoEdR0hqr8s-j_zEFHU-eQHdX1SoeffPta45C_HOGpbQSkw7-XcuIS4-zid2ZZ2sSQNDTJ2GA6CDSA6gLSanCw17yBuAQtBAoxqquKUQyyzp67N2ZxRah7UMTmG9O_46vN5vGFPrC1ziR2kpuL_zHLoE7ukzLqcQ"/>
</div>
<h1 class="font-headline-sm-mobile text-headline-sm-mobile text-on-surface mb-stack-sm">
                Hệ thống Quản lý Nhân viên Thị trường
            </h1>
<h2 class="font-title-md text-title-md text-primary font-semibold">
                VTHM Group
            </h2>
</header>
<!-- Login Form -->
<form class="flex flex-col gap-stack-md">
<!-- Username Input -->
<div class="flex flex-col gap-stack-sm input-field group">
<label class="font-label-lg text-label-lg text-on-surface-variant" for="username">
                    Tài khoản / Mã nhân viên
                </label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline-variant input-icon transition-colors duration-200">
                        person
                    </span>
<input class="w-full bg-surface pl-10 pr-4 py-3 rounded-lg border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all duration-200 font-body-lg text-body-lg text-on-surface placeholder:text-outline" id="username" name="username" placeholder="Nhập tài khoản" type="text"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-stack-sm input-field group">
<label class="font-label-lg text-label-lg text-on-surface-variant" for="password">
                    Mật khẩu
                </label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline-variant input-icon transition-colors duration-200">
                        lock
                    </span>
<input class="w-full bg-surface pl-10 pr-12 py-3 rounded-lg border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all duration-200 font-body-lg text-body-lg text-on-surface placeholder:text-outline" id="password" name="password" placeholder="Nhập mật khẩu" type="password"/>
<button class="absolute right-3 text-outline-variant hover:text-on-surface transition-colors duration-200 p-1 flex items-center justify-center rounded-full focus:outline-none focus:ring-2 focus:ring-primary-container" id="togglePassword" type="button">
<span class="material-symbols-outlined" id="toggleIcon">
                            visibility_off
                        </span>
</button>
</div>
</div>
<!-- Options: Remember Me & Forgot Password -->
<div class="flex items-center justify-between mt-stack-sm mb-stack-md">
<label class="flex items-center gap-2 cursor-pointer group">
<div class="relative flex items-center justify-center">
<input class="peer appearance-none w-5 h-5 border-2 border-outline-variant rounded bg-surface checked:bg-primary-container checked:border-primary-container transition-colors duration-200 cursor-pointer focus:ring-2 focus:ring-primary focus:ring-offset-1 focus:ring-offset-surface" type="checkbox"/>
<span class="material-symbols-outlined absolute text-surface-container-lowest text-[16px] pointer-events-none opacity-0 peer-checked:opacity-100 transition-opacity duration-200" style="font-variation-settings: 'wght' 600;">
                            check
                        </span>
</div>
<span class="font-body-md text-body-md text-on-surface-variant group-hover:text-on-surface transition-colors duration-200">
                        Ghi nhớ đăng nhập
                    </span>
</label>
<a class="font-label-lg text-label-lg text-primary hover:text-on-primary-container transition-colors duration-200" href="#">
                    Quên mật khẩu?
                </a>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary-container hover:bg-[#3ca33c] text-surface-container-lowest font-title-md text-title-md py-4 rounded-lg flex items-center justify-center gap-2 shadow-sm hover:shadow active:scale-[0.98] transition-all duration-200" type="submit">
                ĐĂNG NHẬP
                <span class="material-symbols-outlined" style="font-variation-settings: 'wght' 600;">
                    arrow_forward
                </span>
</button>
</form>
</main>
<!-- Footer App Version -->
<footer class="mt-stack-lg absolute bottom-margin-mobile text-center w-full z-10">
<p class="font-label-sm text-label-sm text-on-surface-variant">
            Phiên bản 2.4.1 (Field Ops)
        </p>
</footer>
<script>
        // Password visibility toggle logic
        document.addEventListener('DOMContentLoaded', () => {
            const togglePasswordBtn = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('toggleIcon');

            if (togglePasswordBtn && passwordInput && toggleIcon) {
                togglePasswordBtn.addEventListener('click', () => {
                    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                    passwordInput.setAttribute('type', type);
                    
                    toggleIcon.textContent = type === 'password' ? 'visibility_off' : 'visibility';
                });
            }
            
            // Add simple entry animation dynamically
            const mainCard = document.querySelector('main');
            mainCard.style.opacity = '0';
            mainCard.style.transform = 'translateY(20px)';
            
            setTimeout(() => {
                mainCard.style.transition = 'opacity 0.5s ease-out, transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1)';
                mainCard.style.opacity = '1';
                mainCard.style.transform = 'translateY(0)';
            }, 100);
        });
    </script>
</body></html>
